# ==========================================================================
# CNB (cnb.cool) 定时流水线 —— TVBox 自建源自动生成 + 推送
#
# 每天定时(Asia/Shanghai 时区)跑 aggregate.py:
#   1. 读取 38 个 CMS 接口 + 26 个核心 csp_ 源
#   2. 生成自建精简源 www/tvbox_self.json
#   3. git push 回本仓库(master 分支)
#
# 零服务器、零依赖(纯 Python 标准库)。
# TVBox 填本仓库 raw 地址即可: https://cnb.cool/tv-lei/tvbox/-/git/raw/master/www/tvbox_self.json
#
# 注意: 使用 master 分支（cnb 默认 main 是废弃的旧分支，请忽略）
# ==========================================================================

master:
  # 每天 04:17 定时触发(避开整点)。cron 为 Asia/Shanghai 时区。
  "crontab: 17 4 * * *":
    - docker:
        image: python:3.12-slim
      stages:
        - name: build
          script: |
            set -e
            echo "=== 配置 git ==="
            git config user.name "cnb-bot"
            git config user.email "cnb-bot@users.noreply.cnb.cool"

            echo "=== 构建(探测存活 + 生成自建精简源: 38 CMS + 23 核心 csp_) ==="
            python aggregate.py --probe

            echo "=== 自检产物 ==="
            python -c "import json; d=json.load(open('www/tvbox_self.json',encoding='utf-8')); print('tvbox_self.json sites=%d' % len(d.get('sites',[])))"

            echo "=== 提交并推送 ==="
            git add -A www/ csp_core.json
            if git diff --cached --quiet; then
              echo "无内容变化, 跳过推送"
              exit 0
            fi
            git commit -m "chore: 自动更新源 $(date '+%F %H:%M')"
            git push origin HEAD:master
